<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I love you sooooooooo much, my beautiful Isa wife, and I hope we continue for the rest of our lives together</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="light light-one"></div>
    <div class="light light-two"></div>

    <main class="page-shell">
      <header class="topbar">
        <span class="badge">For my love</span>
        <h1>I love you sooooooooo much, my beautiful Isa wife, and I hope we continue for the rest of our lives together</h1>
      </header>

      <section class="video-stage" aria-label="Couple slideshow">
        <div class="slides" id="slides">
          <div class="slide active" aria-hidden="false"></div>
          <div class="slide next" aria-hidden="true"></div>
        </div>

        <div class="overlay">
          <div class="caption-pill" id="caption-pill">Forever story</div>
          <div class="lyrics" id="lyrics">أنا من غيرك</div>
        </div>

        <div class="controls">
          <button id="togglePlay" class="control-btn" type="button" aria-label="Pause slideshow">Pause</button>
          <button id="nextSlide" class="control-btn ghost" type="button" aria-label="Next photo">Next</button>
        </div>
      </section>

      <section class="player-panel" aria-label="Music player">
        <div class="music-meta">
          <div>
            <p class="eyebrow">Soundtrack</p>
            <h2>أنا من غيرك</h2>
          </div>
          <div class="music-actions">
            <label class="upload-btn" for="songFile">Choose song</label>
            <input id="songFile" type="file" accept="audio/*" />
            <span class="status-dot" id="songStatus">Waiting for song</span>
          </div>
        </div>

        <audio id="audioPlayer" controls preload="metadata" aria-label="Audio player"></audio>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
