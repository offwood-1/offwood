<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Gift</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="sun-glow"></div>
      <div class="sparkles" id="sparkles"></div>
      <div class="petal-field" id="petalField"></div>

      <div class="message-wrap">
        <div class="message">For You</div>
      </div>

      <div class="gift-box">
        <div class="lid"></div>
        <div class="box-top"></div>
        <div class="box-face"></div>
        <div class="ribbon ribbon-left"></div>
        <div class="ribbon ribbon-right"></div>
        <div class="ribbon ribbon-center"></div>
      </div>

      <div class="bouquet">
        <div class="stem stem-1"></div>
        <div class="stem stem-2"></div>
        <div class="stem stem-3"></div>
        <div class="stem stem-4"></div>

        <div class="flower flower-1">
          <span class="petal petal-1"></span>
          <span class="petal petal-2"></span>
          <span class="petal petal-3"></span>
          <span class="petal petal-4"></span>
          <span class="center"></span>
        </div>

        <div class="flower flower-2">
          <span class="petal petal-1"></span>
          <span class="petal petal-2"></span>
          <span class="petal petal-3"></span>
          <span class="petal petal-4"></span>
          <span class="center"></span>
        </div>

        <div class="flower flower-3">
          <span class="petal petal-1"></span>
          <span class="petal petal-2"></span>
          <span class="petal petal-3"></span>
          <span class="petal petal-4"></span>
          <span class="center"></span>
        </div>

        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="leaf leaf-3"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
